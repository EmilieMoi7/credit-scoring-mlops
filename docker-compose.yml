services:
  gradio-api:
    build: .
    command: python app.py
    ports:
      - "7860:7860"
    volumes:
      - ./logs:/app/logs

  streamlit-dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs